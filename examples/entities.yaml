---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: examples
spec:
  owner: guests
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-website
  annotations:
    terraform/organization: GLUK
    terraform/workspaces: compliace-as-code-workshop-example-workspace
    unleash.io/project-id: test
    unleash.io/filter-tags: component:test1, component:test2
spec:
  type: website
  lifecycle: experimental
  owner: guests
  system: examples
  providesApis: [example-grpc-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-service
  annotations:
    backstage.io/techdocs-ref: dir:./techdocs/example-service
    terraform/organization: orgName
    terraform/workspaces: workspaceName1,workspaceName2,workspaceName3
    unleash.io/project-id: pocproject
spec:
  type: service
  lifecycle: experimental
  owner: artist-relations-team
  system: example-service
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-api
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: example-grpc-api
spec:
  type: grpc
  lifecycle: experimental
  owner: guests
  system: examples
  definition: |
    syntax = "proto3";

    service Exampler {
      rpc Example (ExampleMessage) returns (ExampleMessage) {};
    }

    message ExampleMessage {
      string example = 1;
    };
---
# The portal's own design guide, published as TechDocs so it is versioned with
# the theme that implements it.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: accelerate-design-guide
  title: Accelerate design guide
  description: How Accelerate looks, speaks and is built — colour, type, components and voice.
  tags: [design, documentation]
  annotations:
    backstage.io/techdocs-ref: dir:./techdocs/design-guide
spec:
  type: documentation
  lifecycle: production
  owner: guests
  system: examples
